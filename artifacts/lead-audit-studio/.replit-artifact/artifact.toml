kind = "web"
previewPath = "/"
title = "Boss Mom Consulting"
description = "A lead intake and assessment workspace for Boss Mom Consulting. Prospects can share needs across local SEO/GEO, zero-waste sustainability, and general consulting; the business owner tracks leads, reviews insights, and shares optional website or Fiverr links."
version = "1.0.0"
id = "artifacts/lead-audit-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18196

[services.development]
run = "pnpm --filter @workspace/lead-audit-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lead-audit-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/lead-audit-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18196"
BASE_PATH = "/"
