kind = "web"
previewPath = "/"
title = "Lead & Audit Studio"
description = "A standalone lead intake and audit tool for independent service providers. Prospects can choose a service, complete a needs assessment, and receive a useful summary, while the business owner tracks leads, reviews aggregate insights, and directs prospects to their website or Fiverr profile."
version = "1.0.0"
id = "artifacts/lead-audit-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18196

[services.development]
run = "pnpm --filter @workspace/lead-audit-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lead-audit-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/lead-audit-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18196"
BASE_PATH = "/"
